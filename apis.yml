aid: innovatrix-tech-corp
name: Innovatrix Tech, Corp.
description: >-
  Innovatrix Tech, Corp. operates Sahl (getsahl.io), an AI-powered Governance,
  Risk, and Compliance (GRC) platform built in the MENA region for MENA
  organizations. Sahl automates policy generation, control mapping, risk
  assessment, evidence tracking, vulnerability scanning, and audit preparation
  across 20+ regulatory frameworks including PDPL, ISO 27001, SOC 2, GDPR, NCA
  ECC, and SAMA CSF, aiming to reduce compliance work from months to weeks with
  an AI DPO assistant and compliance copilot. The company was part of the
  Sanabil Investments x 500 Global Accelerator (Batch 8). It surfaced in the API
  Evangelist network as a 500 Global portfolio company; as of this pass it
  publishes a marketing site and a customer application login but no public API,
  developer portal, or SDKs.
